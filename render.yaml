# Render service manifest - single web service runs both UI and worker via supervisord
services:
  - type: web
    name: coinsai-terminal
    env: docker
    buildCommand: ""
    startCommand: ""
    dockerfilePath: Dockerfile
    envVars:
      - key: PAPER_TRADING_MODE
        value: "false"
      - key: CS_API_KEY
        sync: false
      - key: CS_API_SECRET
        sync: false
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
