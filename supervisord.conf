[supervisord]
nodaemon=true

[program:web]
command=gunicorn --workers 1 --threads 4 --worker-class gthread --worker-connections 1000 --timeout 60 --keep-alive 65 --max-requests 500 --max-requests-jitter 50 webhook_server:app --bind 0.0.0.0:$PORT
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=python run_continuous_daemon.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
