name: Deploy to Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy (deploy hook webhook)
        env:
          # Optional override: set RENDER_DEPLOY_HOOK_URL as a repo secret to rotate keys without editing this file.
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          HOOK_URL="${RENDER_DEPLOY_HOOK_URL:-https://api.render.com/deploy/srv-d9ss8enqj5pc73deacl0?key=TwVWr_4EHrg}"
          echo "Triggering Render deploy hook..."
          HTTP_CODE=$(curl -sS -o /tmp/render_deploy_resp.json -w "%{http_code}" -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          echo "Render deploy hook responded with HTTP $HTTP_CODE"
          cat /tmp/render_deploy_resp.json || true
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Render deploy hook returned HTTP $HTTP_CODE — check the URL/key"
            exit 1
          fi

      - name: Fallback — trigger via Render API (if API secrets are configured)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "RENDER_API_KEY / RENDER_SERVICE_ID not set — skipping API fallback (deploy hook already used)"
            exit 0
          fi
          echo "Triggering deploy for Render service $RENDER_SERVICE_ID via Render API"
          curl -sSf -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":false}'
