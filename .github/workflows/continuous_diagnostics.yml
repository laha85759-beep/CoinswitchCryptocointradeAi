name: CoinsAI Dedicated 24/7 Continuous Diagnostics Agent

on:
  schedule:
    # Runs every hour on the hour 24/7/365
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-continuous-diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3 pandas numpy cryptography flask pyjwt

    - name: Execute 24/7 Hourly & Daily Diagnostics Agent
      env:
        CS_API_KEY: ${{ secrets.CS_API_KEY }}
        CS_API_SECRET: ${{ secrets.CS_API_SECRET }}
        COINSWITCH_API_KEY: ${{ secrets.CS_API_KEY }}
        COINSWITCH_API_SECRET: ${{ secrets.CS_API_SECRET }}
        DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      run: |
        python diagnostics_agent.py

    - name: Commit & Persist Diagnostics Health Logs
      run: |
        git config --global user.name 'CoinsAI Diagnostics Agent'
        git config --global user.email 'diagnostics@coinsai.internal'
        git add last_hourly_diag.txt last_daily_diag.txt 2>/dev/null || true
        git diff-index --quiet HEAD || git commit -m "auto: 24/7 Diagnostics Agent state sync"
        git push || true
