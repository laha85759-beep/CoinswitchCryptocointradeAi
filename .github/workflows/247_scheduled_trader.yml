name: CoinsAI 24/7 Scheduled Trading Bot Daemon

on:
  schedule:
    # Runs every 5 minutes 24/7 automatically
    - cron: '*/5 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-trading-agent-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Live 24/7 Trading Agent Cycle
      env:
        CS_API_KEY: ${{ secrets.CS_API_KEY }}
        CS_API_SECRET: ${{ secrets.CS_API_SECRET }}
        COINSWITCH_API_KEY: ${{ secrets.CS_API_KEY }}
        COINSWITCH_API_SECRET: ${{ secrets.CS_API_SECRET }}
        DELTA_API_KEY: ${{ secrets.DELTA_API_KEY }}
        DELTA_API_SECRET: ${{ secrets.DELTA_API_SECRET }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        MT5_EC2_HOST: http://13.233.118.122:5005
        MT5_BRIDGE_SECRET: ck_capital_secret_2026
        MYFUNDEDPERP_API_KEY: fp_live_f105a13ddb2975f1aa71de07e2236baf6b502dc0efd3a014ed1a558bc3ae66e7
        MFP_API_KEY: fp_live_f105a13ddb2975f1aa71de07e2236baf6b502dc0efd3a014ed1a558bc3ae66e7
        MFP_ACCOUNT_ID: jh790a9nfyevvb5jfkqt37e4sd8fh1rm
        WEEKEND_TRADING_DISABLED: 'false'
      run: |
        python main.py

    - name: Commit & Persist Updated Open Trades & Yield State
      run: |
        git config --global user.name 'CoinsAI Bot Daemon'
        git config --global user.email 'bot@coinsai.internal'
        git add open_trades_cs.json open_trades_delta.json open_options.json earned_yield.json daily_pnl.json 2>/dev/null || true
        git commit -m "auto: 24/7 GitHub Actions agent state update" || echo "No state changes to commit"
        git pull --rebase origin main || true
        git push origin main || true
