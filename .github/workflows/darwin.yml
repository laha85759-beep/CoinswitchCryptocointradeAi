name: Darwin Self-Improvement Loop

on:
  schedule:
    - cron: "5 0 * * *"      # Daily weights update: every day at 00:05 UTC
    - cron: "0 1 * * 0"      # Weekly cycle: every Sunday at 01:00 UTC
  workflow_dispatch:          # Manual trigger

jobs:
  darwin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Restore persisted state between runs ────────────────────────────────
      - name: Restore trade state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            open_trades_cs.json
            open_trades_delta.json
            open_options.json
            processed_signals.json
            daily_pnl.json
            last_daily_report.txt
            circuit_breaker.json
            agent_weights.json
            darwin_history.json
            spawned_agents.json
          key: trade-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trade-state-${{ runner.os }}-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Daily Weight Update
        if: github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CS_API_KEY:           ${{ secrets.CS_API_KEY }}
          CS_API_SECRET:        ${{ secrets.CS_API_SECRET }}
          DELTA_API_KEY:        ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET:     ${{ secrets.DELTA_API_SECRET }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ONEMIN_AI_API_KEY:    ${{ secrets.ONEMIN_AI_API_KEY }}
          PAPER_TRADING_MODE:   'false'
        run: python darwin_engine.py --daily

      - name: Run Weekly Autoresearch Cycle
        if: github.event.schedule == '0 1 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          CS_API_KEY:           ${{ secrets.CS_API_KEY }}
          CS_API_SECRET:        ${{ secrets.CS_API_SECRET }}
          DELTA_API_KEY:        ${{ secrets.DELTA_API_KEY }}
          DELTA_API_SECRET:     ${{ secrets.DELTA_API_SECRET }}
          TELEGRAM_TOKEN:       ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          ONEMIN_AI_API_KEY:    ${{ secrets.ONEMIN_AI_API_KEY }}
          PAPER_TRADING_MODE:   'false'
        run: python darwin_engine.py --cycle

      # ── Always save state, even on failure ─────────────────────────────────
      - name: Save trade state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            open_trades_cs.json
            open_trades_delta.json
            open_options.json
            processed_signals.json
            daily_pnl.json
            last_daily_report.txt
            circuit_breaker.json
            agent_weights.json
            darwin_history.json
            spawned_agents.json
          key: trade-state-${{ runner.os }}-${{ github.run_id }}
